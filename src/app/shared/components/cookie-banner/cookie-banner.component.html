<div
  *ngIf="showBanner"
  class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 shadow-lg"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex-1">
        <p class="text-sm text-gray-700 font-['DM_Sans']">
          {{ "cookieBanner.message" | translate }}
          <a
            href="/kolacici"
            class="text-solar-500 hover:text-solar-600 underline ml-1"
          >
            {{ "cookieBanner.learnMore" | translate }}
          </a>
        </p>
      </div>
      <div class="flex gap-3">
        <button
          (click)="rejectCookies()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors font-['DM_Sans']"
        >
          {{ "cookieBanner.reject" | translate }}
        </button>
        <button
          (click)="acceptCookies()"
          class="px-4 py-2 text-sm font-medium text-white bg-solar-500 hover:bg-solar-700 rounded-lg transition-colors font-['DM_Sans']"
        >
          {{ "cookieBanner.accept" | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
