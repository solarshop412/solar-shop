<section class="py-16 bg-white">
  <!-- Brand Logos Marquee / Slider -->
  <div class="brand-slider" aria-label="Brand logos">
    <div class="brand-track">
      <!-- Set 1 -->
      <div class="brand-set" 
        *ngFor="let brand of brands">
        <img [src]="'/assets/images/brands/' + brand.image" 
            [alt]="brand.name" 
            [title]="brand.name"
            loading="lazy" />
      </div>

      <!-- Set 2 (duplicate for seamless loop) -->
      <div class="brand-set" aria-hidden="true"
        *ngFor="let brand of brands">
        <img [src]="'/assets/images/brands/' + brand.image" 
            [alt]="brand.name" 
            [title]="brand.name"
            loading="lazy" />
      </div>
    </div>
  </div>
</section>
