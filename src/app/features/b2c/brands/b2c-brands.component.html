<section class="py-16 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2
      class="text-3xl font-bold text-b2b-gray-900 mb-12 font-['Poppins'] text-center"
    >
      {{ "b2b.products.ourBrands" | translate }}
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div
        *ngFor="let brand of brands"
        class="rounded-2xl overflow-hidden h-64"
      >
        <img
          [src]="brand.image"
          [alt]="brand.name"
          class="w-full h-full object-contain bg-white p-4"
        />
      </div>
    </div>
  </div>
</section>
