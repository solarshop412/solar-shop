<!-- Hero Section -->
<section
  class="relative min-h-screen lg:min-h-[60vh] xl:min-h-[65vh] overflow-hidden -mt-4"
>
  <!-- Background with rounded bottom -->
  <div class="absolute inset-0 bg-gradient-to-br from-solar-400 to-solar-900">
    <!-- Background Image -->
    <img
      src="/assets/images/hero-cover-image.webp"
      alt="Sustainable Building Materials"
      class="w-full h-full object-cover opacity-20"
      onerror="
        console.error('Hero background image failed to load:', this.src);
        this.style.display = 'none';
      "
    />
    <!-- Gradient Overlay -->
    <!-- <div class="absolute inset-0 bg-gradient-to-br from-solar-600/80 to-solar-800/80 opacity-55"></div> -->
  </div>

  <!-- Content Container -->
  <div
    class="relative z-10 flex flex-col min-h-screen lg:min-h-[60vh] xl:min-h-[65vh] justify-center px-4 sm:px-6 lg:px-8 pt-8 lg:pt-16"
  >
    <div class="max-w-7xl mx-auto text-center">
      <!-- Main Heading -->
      <h1
        class="text-white font-bold text-3xl sm:text-5xl lg:text-5xl xl:text-6xl leading-tight mb-4 lg:mb-6 font-['Poppins']"
      >
        {{ "hero.mainTitle" | translate }}
      </h1>

      <!-- Subtitle -->
      <p
        class="text-white text-lg sm:text-xl lg:text-xl leading-relaxed mb-8 lg:mb-10 font-['DM_Sans'] opacity-90 max-w-3xl mx-auto"
      >
        {{ "hero.subtitle" | translate }}
      </p>


      <!-- CTA Buttons -->
      <div
        class="flex flex-col sm:flex-row gap-4 justify-center items-center pb-16 mb-4"
      >
        <button
          (click)="onExploreProducts()"
          [disabled]="isLoading$ | async"
          class="bg-solar-500 text-white font-semibold text-base px-8 py-3 rounded-xl hover:bg-solar-500 transition-all duration-300 font-['DM_Sans'] disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl transform hover:-translate-y-1"
        >
          <span *ngIf="(isLoading$ | async) === false">
            {{ "hero.exploreProducts" | translate }}
          </span>
          <span
            *ngIf="isLoading$ | async"
            class="flex items-center justify-center"
          >
            <svg
              class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            {{ "hero.loading" | translate }}
          </span>
        </button>

        <button
          (click)="onExploreStores()"
          class="bg-white/20 backdrop-blur-sm text-white font-semibold px-8 py-3 rounded-xl hover:bg-white/30 transition-all duration-300 font-['DM_Sans'] border border-white/30 shadow-lg hover:shadow-xl transform hover:-translate-y-1"
        >
          {{ "hero.ourStores" | translate }}
        </button>
      </div>
    </div>
  </div>

  <!-- Rounded bottom shape - moved to bottom after content -->
  <div
    class="absolute bottom-0 left-0 right-0 h-16 bg-white rounded-t-[40px]"
  ></div>
</section>
