<section class="py-16 bg-b2b-gray-50" *ngIf="categories.length">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-end justify-between gap-4 mb-10">
      <h2 class="text-3xl font-bold text-b2b-gray-900 font-['Poppins']">
        {{ 'b2b.products.productCategories' | translate }}
      </h2>

      <!-- optional: small hint text -->
      <p class="hidden md:block text-sm text-b2b-gray-600">
        {{ 'products.browseByCategory' | translate }}
      </p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4 lg:gap-6">
      <div
        *ngFor="let category of categories; trackBy: trackByCategoryId"
        role="button"
        tabindex="0"
        (click)="navigateToProducts(category.slug)"
        (keydown.enter)="navigateToProducts(category.slug)"
        (keydown.space)="navigateToProducts(category.slug)"
        [attr.aria-label]="category.name"
        class="group cursor-pointer rounded-2xl bg-white border border-b2b-gray-200 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 overflow-hidden focus:outline-none focus:ring-2 focus:ring-solar-500/40"
      >
        <!-- Media header -->
        <div class="relative aspect-[4/3] sm:aspect-[16/10] bg-gradient-to-br from-solar-100 to-solar-200 overflow-hidden">
          <!-- Image if exists -->
          <img
            *ngIf="category.imageUrl; else mediaFallback"
            [src]="'/assets/images/categories/' + category.imageUrl"
            [alt]="category.name"
            loading="lazy"
            class="w-full h-full object-cover group-hover:scale-[1.03] transition-transform duration-300"
            
          />

          <!-- Fallback media (icon) -->
          <ng-template #mediaFallback>
            <div class="absolute inset-0 flex items-center justify-center">
              <div
                class="text-solar-700/90 group-hover:text-solar-800 transition-colors duration-300"
                [innerHTML]="getCategoryIcon(category.icon)"
              ></div>
            </div>
          </ng-template>

          <!-- optional badge: product count -->
          <div
            *ngIf="category.productCount"
            class="absolute top-3 right-3 bg-white/90 backdrop-blur px-2 py-1 rounded-full text-xs font-semibold text-b2b-gray-800 shadow"
          >
            {{ category.productCount }}
          </div>

          <!-- subtle bottom gradient for readability -->
          <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-black/25 to-transparent"></div>
        </div>

        <!-- Content -->
        <div class="p-4">
          <h3
            class="text-sm sm:text-base font-semibold text-b2b-gray-900 group-hover:text-solar-700 transition-colors duration-200 font-['Poppins'] line-clamp-2"
            [title]="category.name"
          >
            {{ category.name }}
          </h3>

          <!-- CTA row -->
          <div class="mt-4 flex items-center justify-between">
            <span class="text-xs sm:text-sm text-b2b-gray-600">
              {{ 'products.viewProducts' | translate }}
            </span>
            <span class="translate-x-0 group-hover:translate-x-0.5 transition-transform">→</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
