<div class="space-y-4">
  <!-- Main Image -->
  <div class="aspect-square overflow-hidden rounded-lg bg-gray-100 relative">
    <img
      [src]="selectedImage"
      [alt]="product.name"
      class="w-full h-full object-contain cursor-zoom-in"
      (error)="onImageError($event)"
      (click)="openZoom()"
    />
  </div>

  <!-- Thumbnail Gallery -->
  <div *ngIf="isImageAvailable" 
      class="grid grid-cols-4 gap-4">
    <button
      *ngFor="let image of productImages; let i = index"
      (click)="selectImage(image)"
      class="aspect-square overflow-hidden rounded-lg bg-gray-100 border-2 transition-colors"
      [class.border-solar-600]="selectedImage === image"
      [class.border-gray-200]="selectedImage !== image"
    >
      <img
        [src]="image"
        [alt]="product.name + ' - Image ' + (i + 1)"
        class="w-full h-full object-contain"
      />
    </button>
  </div>

  <!-- Image Counter -->
  <div *ngIf="isImageAvailable"
       class="text-center text-sm text-gray-500 font-['DM_Sans']">
    {{ getCurrentImageIndex() + 1 }} / {{ productImages.length }}
  </div>

  <!-- Zoom Button -->
  <button
    *ngIf="isImageAvailable"
    (click)="openZoom()"
    class="w-full px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors font-['DM_Sans']"
  >
    <svg
      class="w-4 h-4 inline mr-2"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"
      />
    </svg>
    {{ "productDetails.zoomImage" | translate }}
  </button>
</div>

<!-- Zoom Modal -->
<div
  *ngIf="isZoomOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90"
  (click)="closeZoom()"
  (keydown.escape)="closeZoom()"
>
  <div class="relative max-w-4xl max-h-screen p-4">
    <!-- Close Button -->
    <button
      (click)="closeZoom()"
      class="absolute top-2 right-2 z-10 p-2 text-white hover:text-gray-300 transition-colors"
    >
      <svg
        class="w-8 h-8"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>

    <!-- Navigation Arrows -->
    <button
      *ngIf="productImages.length > 1"
      (click)="previousImage(); $event.stopPropagation()"
      class="absolute left-2 top-1/2 transform -translate-y-1/2 z-10 p-2 text-white hover:text-gray-300 transition-colors"
    >
      <svg
        class="w-8 h-8"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </button>

    <button
      *ngIf="productImages.length > 1"
      (click)="nextImage(); $event.stopPropagation()"
      class="absolute right-2 top-1/2 transform -translate-y-1/2 z-10 p-2 text-white hover:text-gray-300 transition-colors"
    >
      <svg
        class="w-8 h-8"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5l7 7-7 7"
        />
      </svg>
    </button>

    <!-- Zoomed Image -->
    <img
      [src]="selectedImage"
      [alt]="product.name"
      class="max-w-full max-h-full object-contain"
      (click)="$event.stopPropagation()"
    />

    <!-- Image Counter in Modal -->
    <div
      class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-white text-sm bg-black bg-opacity-50 px-3 py-1 rounded"
    >
      {{ getCurrentImageIndex() + 1 }} / {{ productImages.length }}
    </div>
  </div>
</div>
