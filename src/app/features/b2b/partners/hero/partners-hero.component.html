<section class="relative bg-orange-500 py-24 text-center">
  <div class="absolute inset-0"></div>
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl md:text-6xl font-bold text-white mb-6 font-['Poppins']">
      {{ "b2b.hero.title" | translate }}
    </h1>

    <p
      class="text-xl md:text-2xl text-white/90 mb-8 max-w-3xl mx-auto font-['DM_Sans']"
    >
      {{ "b2b.hero.subtitle" | translate }}
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <!-- Buttons for authenticated company users -->
      <ng-container *ngIf="isCompanyContact$ | async">
         <button
          (click)="navigateToRegister()"
          class="bg-white text-orange-600 px-8 py-4 rounded-lg font-semibold hover:bg-orange-50 transition-all"
        >
          {{ "b2b.hero.getStarted" | translate }}
        </button>
        <button
          (click)="navigateToAbout()"
          class="border-2 border-white text-white px-8 py-4 rounded-lg font-semibold hover:bg-white/10 transition-all"
        >
          {{ "b2b.hero.learnMore" | translate }}
        </button>
      </ng-container>

      <!-- Default buttons for non-authenticated users -->
      <ng-container *ngIf="(isCompanyContact$ | async) === false">
        <button
          (click)="navigateToRegister()"
          class="bg-white text-orange-600 px-8 py-4 rounded-lg font-semibold hover:bg-orange-50 transition-all"
        >
          {{ "b2b.hero.getStarted" | translate }}
        </button>
        <button
          (click)="navigateToAbout()"
          class="border-2 border-white text-white px-8 py-4 rounded-lg font-semibold hover:bg-white/10 transition-all"
        >
          {{ "b2b.hero.learnMore" | translate }}
        </button>
      </ng-container>
    </div>
  </div>
</section>
