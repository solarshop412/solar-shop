<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-3xl font-bold text-gray-900">Admin</h1>
    <button
      (click)="refreshStats()"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
    >
      {{ "admin.refreshData" | translate }}
    </button>
  </div>

  <div
    *ngIf="stats$ | async as stats"
    class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-6"
  >
    <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-600">Total Products</p>
          <p class="text-3xl font-bold text-gray-900">
            {{ stats.totalProducts }}
          </p>
        </div>
        <div class="p-3 bg-blue-100 rounded-lg">
          <svg
            class="w-6 h-6 text-blue-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
            />
          </svg>
        </div>
      </div>
      <div class="mt-4">
        <a
          routerLink="/admin/proizvodi"
          class="text-blue-600 hover:text-blue-800 text-sm font-medium"
        >
          Manage Products →
        </a>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-600">Total Users</p>
          <p class="text-3xl font-bold text-gray-900">{{ stats.totalUsers }}</p>
        </div>
        <div class="p-3 bg-indigo-100 rounded-lg">
          <svg
            class="w-6 h-6 text-indigo-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-.5a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
        </div>
      </div>
      <div class="mt-4">
        <a
          routerLink="/admin/korisnici"
          class="text-indigo-600 hover:text-indigo-800 text-sm font-medium"
        >
          Manage Users →
        </a>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-gray-600">Total Orders</p>
          <p class="text-3xl font-bold text-gray-900">
            {{ stats.totalOrders }}
          </p>
        </div>
        <div class="p-3 bg-orange-100 rounded-lg">
          <svg
            class="w-6 h-6 text-orange-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
            />
          </svg>
        </div>
      </div>
      <div class="mt-4">
        <a
          routerLink="/admin/narudzbe"
          class="text-orange-600 hover:text-orange-800 text-sm font-medium"
        >
          Manage Orders →
        </a>
      </div>
    </div>
  </div>

  <div *ngIf="stats$ | async as stats">
  </div>

  <div
    *ngIf="(stats$ | async) === null"
    class="flex items-center justify-center h-64"
  >
    <div
      class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"
    ></div>
  </div>
</div>
